# Aircraft data sheet (Loxodrome). Units in the field names: kg, m, L, kt,
# ft, deg C; distances in metres. Verify against the aircraft flight manual.
#
# GENERIC sheet: the Cessna 152 from its Pilot's Operating Handbook alone,
# no airframe's weighing: the 1980 Model 152 Information Manual (D1170-13,
# 1 July 1979), the POH as issued. Converted from the POH's lb, in, US gal
# and ft: 1 lb = 0.45359237 kg, 1 in = 0.0254 m, 1 US gal = 3.785411784 L,
# 1 ft = 0.3048 m. The 152 is certificated in the utility category.
version: 1

aircraft:
  type: C152
  icaoType: C152
  name: Cessna 152, 1980 model (POH D1170-13)
  generic: c152

fuel:
  # Standard tanks, 1-4: 26 US gal total, 24.5 usable (the optional long
  # range tanks hold 39 / 37.5). Approved grades, 1-3: 100LL (blue) and
  # 100, formerly 100/130 (green); 100 is not one of the app's grades.
  capacityL: 98.4
  usableL: 92.7
  types: [100LL]
  consumptionLph: 23.1

cruise:
  speedKt: 102
  name: '75 %'
  # The POH's cruise table (Figure 5-7, p. 5-14: 1670 lb, recommended lean
  # mixture, standard temperature), read at 3000 ft: each power found between
  # its rpm rows at 2000 and at 4000 ft, then the mean of the two altitudes;
  # speeds rounded down, flows to 0.1 L/h. The speeds are with wheel
  # fairings, about 2 kt more than without (its note). 75 %: 102.00 kt,
  # 6.100 US gal/h.
  settings:
    - { name: '65 %', speedKt: 95, consumptionLph: 20.0 }
    - { name: '55 %', speedKt: 88, consumptionLph: 17.0 }

climb: # Figure 5-5, p. 5-12: 1670 lb, flaps up, full throttle, 67 KIAS; 765 ft/min at 0 °C and 700 at 20 °C at sea level, 716.25 at ISA (computed)
  speedKt: 67
  rateFtMin: 716

massAndBalance:
  # Empty mass and arm: the POH's sample loading problem (Figure 6-6,
  # p. 6-9), 1136 lb at a moment of 34.0 lb-in/1000, so 29.930 in; the mass
  # rounded down to 0.1 kg, so that example at 1670 lb stays inside the
  # envelope.
  emptyMassKg: 515.2
  emptyArmM: 0.7602
  stations:
    # Loading arrangements, Figure 6-3 p. 6-7: seats at 39 in (33 to 41),
    # baggage area 1 at 64 (50 to 76, or a passenger on the child's seat),
    # area 2 at 84 (76 to 94). Limits 2-5: area 1 120 lb, area 2 40 lb, the
    # two together 120 lb (a combined limit the app cannot state).
    - { label: Seats, armM: 0.9906, defaultMassKg: 80 }
    - { label: Baggage area 1, armM: 1.6256, defaultMassKg: 0, maxMassKg: 54.4 }
    - { label: Baggage area 2, armM: 2.1336, defaultMassKg: 0, maxMassKg: 18.1 }
  fuelArmM: 1.0668 # standard tanks' usable fuel at station 42.0 (Figure 6-3 note)
  # 2-5 / 2-6: forward 31.0 in at 1350 lb or less, then straight to 32.65 in
  # at 1670 lb; aft 36.5 in at all weights. The limit lines run to the foot
  # of the CG-limits chart (Figure 6-9, p. 6-12) at 1000 lb.
  envelope:
    - { armM: 0.7874, massKg: 453.59 }
    - { armM: 0.7874, massKg: 612.35 }
    - { armM: 0.82931, massKg: 757.49 }
    - { armM: 0.9271, massKg: 757.49 }
    - { armM: 0.9271, massKg: 453.59 }

performance:
  kind: table
  marginFactor: 1.3
  # Dry grass: +15 % of the ground roll at take-off, +45 % at landing (the
  # tables' notes); one factor on both distances must cover the landing
  # distance over 15 m, at most x1.201: 1.21. Wet: none in the POH,
  # the app's default. Flaps up landing: "allow for 35 % longer distances"
  # (Figure 5-11 note).
  grassFactor: 1.21
  wetFactor: 1.15
  flaplessLandingFactor: 1.35
  # The POH charts one mass, 1670 lb, carried in both columns; the lower
  # column stands at the CG chart's foot (1000 lb) so that no real mass
  # reads as extrapolated.
  massMaxKg: 757.49 # 1670 lb
  massMinKg: 453.59 # 1000 lb
  takeoffFlapsDeg: 10
  takeoffProcedure: short-field
  landingFlapsDeg: 30
  wind:
    # Both tables: -10 % per 9 kt of headwind, +10 % per 2 kt of tailwind
    # up to 10 kt.
    takeoffHeadwind: [[0, 1.0], [9, 0.9], [18, 0.8], [27, 0.7]]
    landingHeadwind: [[0, 1.0], [9, 0.9], [18, 0.8], [27, 0.7]]
    tailwindPctPer2Kt: 10
  # POH distances by pressure altitude and outside air temperature, as
  # printed (ft to metres, 0.1 m): cells [ground roll, total over 50 ft].
  # Take-off, Figure 5-4 (p. 5-11): short field technique, flaps 10°.
  # Landing, Figure 5-11 (p. 5-19): flaps 30°, power off, maximum braking.
