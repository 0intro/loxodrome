  # 1706 ft for the printed 1650. Its own headwind guides give its factors.
  accelerateStop:
    massMaxKg: 1905.08
    massMinKg: 1270.06
    headwind: [[0, 1.0], [4.4, 0.92], [8.7, 0.83], [13.1, 0.74], [17.4, 0.66], [21.8, 0.58], [26.1, 0.51]]
    rows:
