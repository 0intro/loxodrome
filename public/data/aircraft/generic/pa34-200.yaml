oneEngineInoperative:
  # 3-2 E: minimum control speed 80 mph (69.52 kt, rounded up), the radial
  # red line; best rate of climb speed on one engine 105 mph, the blue
  # line, 91.5 kt as the specifications print it (1-1). No best angle of
  # climb speed on one engine is printed.
  vmcKt: 69.6
  vyseKt: 91.5
  # Single engine climb (8-8, revised 26 April 1974: cowl flap open on the
  # operating engine only, gear and flaps up, 5 deg of bank into the
  # operating engine, full throttle, mixture leaned per Lycoming): rate of
  # climb by density altitude, its lines at 3400, 3700, 4000 and 4200 lb
  # read straight (4200 lb: 193 ft/min at sea level, 50 ft/min at 3686 ft,
  # nil at 4975 ft, for the specifications' 190, 3650 and 5000; 4000 lb:
  # 231, 5192 and 6629 for 230, 5200 and 6600). Cells every 2000 ft to
  # 14000 ft at ISA -20, ISA and ISA +20 (the app's ISA), each read at its
  # density altitude, rounded down to 5 ft/min. The 4200 lb line lies
  # closer to the 4000 lb one (38 ft/min for 200 lb at sea level) than that
  # one does to the 3700 lb line (101 ft/min for 300 lb): one straight line
  # in mass from 4200 to 3400 lb cannot follow both, so the 4200 lb cells
  # keep the chart (1.7 ft/min under it on average) and the 3400 lb ones
  # are lowered until no weight between reads above it: 3700 lb up to
  # 66 ft/min under the chart, 3400 lb up to 113 low down, exact high up.
  # The lines are carried straight past the chart's -100 ft/min edge.
  # There is no time limit on full power (6-8) and the take-off is flown
  # flaps up, so this table stands for the take-off climb too.
  climb:
    massMaxKg: 1905.08 # 4200 lb
    massMinKg: 1542.22 # 3400 lb
    rows:
      - { altFt: 0, isaOffsetC: -20, massMax: 285, massMin: 410 }
      - { altFt: 0, isaOffsetC: 0, massMax: 190, massMin: 315 }
      - { altFt: 0, isaOffsetC: 20, massMax: 100, massMin: 265 }
      - { altFt: 2000, isaOffsetC: -20, massMax: 210, massMin: 335 }
      - { altFt: 2000, isaOffsetC: 0, massMax: 115, massMin: 240 }
      - { altFt: 2000, isaOffsetC: 20, massMax: 25, massMin: 190 }
      - { altFt: 4000, isaOffsetC: -20, massMax: 130, massMin: 280 }
      - { altFt: 4000, isaOffsetC: 0, massMax: 35, massMin: 185 }
      - { altFt: 4000, isaOffsetC: 20, massMax: -55, massMin: 135 }
      - { altFt: 6000, isaOffsetC: -20, massMax: 55, massMin: 245 }
      - { altFt: 6000, isaOffsetC: 0, massMax: -40, massMin: 150 }
      - { altFt: 6000, isaOffsetC: 20, massMax: -130, massMin: 100 }
      - { altFt: 8000, isaOffsetC: -20, massMax: -25, massMin: 195 }
      - { altFt: 8000, isaOffsetC: 0, massMax: -120, massMin: 100 }
      - { altFt: 8000, isaOffsetC: 20, massMax: -205, massMin: 40 }
      - { altFt: 10000, isaOffsetC: -20, massMax: -100, massMin: 145 }
      - { altFt: 10000, isaOffsetC: 0, massMax: -195, massMin: 50 }
      - { altFt: 10000, isaOffsetC: 20, massMax: -285, massMin: -35 }
      - { altFt: 12000, isaOffsetC: -20, massMax: -175, massMin: 70 }
      - { altFt: 12000, isaOffsetC: 0, massMax: -275, massMin: -25 }
      - { altFt: 12000, isaOffsetC: 20, massMax: -360, massMin: -110 }
      - { altFt: 14000, isaOffsetC: -20, massMax: -255, massMin: -5 }
      - { altFt: 14000, isaOffsetC: 0, massMax: -350, massMin: -100 }
      - { altFt: 14000, isaOffsetC: 20, massMax: -440, massMin: -185 }

notes: Generic sheet. Empty mass and arm from the weight and balance plotter's
  sample problem (2615 lb at 82.0 in), not an aircraft's weighing.
source: Piper PA-34-200 Seneca Pilot's Operating Manual, Piper 761 506, revised
  to 30 November 1987, with the FAA approved Airplane Flight Manual, report
  VB-423, revised 14 June 1983, and the Weight and Balance, report VB-424.
