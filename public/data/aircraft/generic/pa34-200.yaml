    - { altFt: 8000, temperatureC: -17.8, massMax: [270, 460], massMin: [185, 375] }
    - { altFt: 8000, temperatureC: -6.7, massMax: [285, 475], massMin: [190, 380] }
    - { altFt: 8000, temperatureC: 4.4, massMax: [295, 485], massMin: [195, 390] }
    - { altFt: 8000, temperatureC: 15.6, massMax: [310, 500], massMin: [205, 400] }
    - { altFt: 8000, temperatureC: 26.7, massMax: [325, 520], massMin: [215, 410] }
    - { altFt: 8000, temperatureC: 37.8, massMax: [340, 545], massMin: [230, 430] }
  # Accelerate-stop (8-6: flaps up, full power before brake release,
  # accelerate to 80 mph, then stop), read and covered as the take-off is:
