# Aircraft data sheet (Loxodrome). Units in the field names: kg, m, L, kt,
# ft, deg C; distances in metres. Verify against the aircraft flight manual.
#
# GENERIC sheet: the Cessna 172S from its Pilot's Operating Handbook alone,
# no airframe's weighing. Two editions agree on every figure used here,
# distance for distance: 172SPHUS at revision 5 (19 July 2004, s/n 172S8001
# and on) and 172SPHAUS-04 (NAV III, revision 4 of 12 October 2006, s/n
# 172S9810 and on); pages below are the NAV III's. Converted from the POH's
# lb, in, US gal and ft: 1 lb = 0.45359237 kg, 1 in = 0.0254 m,
# 1 US gal = 3.785411784 L, 1 ft = 0.3048 m.
version: 1

aircraft:
  type: C172S
  icaoType: C172
  name: Cessna 172S Skyhawk SP, s/n 172S8001 and on
  generic: c172s

fuel:
  # POH 1-6: 56.0 US gal total, 53.0 usable (26.5 a tank). Approved grades
  # (1-5, 2-16) 100LL (blue) and 100 (green); 100 is not one of the app's
  # grades.
  capacityL: 212.0
  usableL: 200.6
  types: [100LL]
  consumptionLph: 38.5

cruise:
  speedKt: 117
  name: '75 %'
  # The POH's cruise table (Figure 5-8, p. 5-19: 2550 lb, recommended lean
  # mixture, standard temperature), read at 3000 ft: each power found between
  # its rpm rows at 2000 and at 4000 ft, then the mean of the two altitudes;
  # speeds rounded down, flows to 0.1 L/h. 75 % is the maximum cruise power
  # with the recommended lean mixture (its note). 75 %: 117.50 kt,
  # 10.175 US gal/h.
  settings:
    - { name: '65 %', speedKt: 111, consumptionLph: 34.3 }
    - { name: '55 %', speedKt: 102, consumptionLph: 29.7 }

climb: # Figure 5-6, p. 5-17: 2550 lb, flaps up, full throttle, 74 KIAS; 785 ft/min at 0 °C and 710 at 20 °C at sea level, 728.75 at ISA (computed)
  speedKt: 74
  rateFtMin: 729

massAndBalance:
  # Empty mass and arm: the POH's sample loading problem (Figure 6-3, p. 6-10),
  # 1642 lb at a moment of 62.6 lb-in/1000, so 38.124 in; the mass rounded
  # down to 0.1 kg, so that example at 2550 lb stays inside the envelope.
  emptyMassKg: 744.7
  emptyArmM: 0.9684
  stations:
    # Loading arrangements, Figure 6-5 p. 6-13: seats at 37 in (34 to 46),
    # rear seats 73, baggage area A 95 (82 to 108), B 123 (108 to 142).
    # Baggage limits 2-8: A 120 lb, B 50 lb, A and B together 120 lb (the
    # combined limit is not a station the app can state).
    - { label: Front seats, armM: 0.9398, defaultMassKg: 80 }
    - { label: Rear seats, armM: 1.8542, defaultMassKg: 0 }
    - { label: Baggage A, armM: 2.413, defaultMassKg: 0, maxMassKg: 54.4 }
    - { label: Baggage B, armM: 3.1242, defaultMassKg: 0, maxMassKg: 22.6 }
  fuelArmM: 1.2192 # usable fuel at FS 48.00 (Figure 6-5 note)
  # Normal category, 2-8: forward 35.0 in at 1950 lb or less, then straight
  # to 41.0 in at 2550 lb; aft 47.3 in at all weights. The limit lines run
  # to the foot of the CG-limits chart (Figure 6-8, p. 6-16) at 1500 lb.
  envelope:
    - { armM: 0.889, massKg: 680.39 }
    - { armM: 0.889, massKg: 884.51 }
    - { armM: 1.0414, massKg: 1156.66 }
    - { armM: 1.2014, massKg: 1156.66 }
    - { armM: 1.2014, massKg: 680.39 }

performance:
  kind: table
  marginFactor: 1.3
  # Dry grass: the POH adds 15 % of the ground roll at take-off and 45 % at
  # landing; one factor on both distances must cover the landing distance
  # over 15 m, at most x1.215 (1 + 0.45 roll / total over the
  # landing table): 1.22, which overstates take-off on grass. Wet: the
  # POH gives no factor, the app's default. Flaps up landing: "allow for 35 %
  # longer distances" (Figure 5-11 note).
  grassFactor: 1.22
  wetFactor: 1.15
  flaplessLandingFactor: 1.35
  massMaxKg: 1156.66 # 2550 lb
  massMinKg: 997.9 # 2200 lb
  # The tables are the short field technique's, take-off flaps 10° (Figure
  # 5-5 conditions); landing flaps FULL (the POH prints no angle).
  takeoffFlapsDeg: 10
  takeoffProcedure: short-field
  wind:
    # Both tables: distances -10 % per 9 kt of headwind, +10 % per 2 kt of
    # tailwind up to 10 kt.
    takeoffHeadwind: [[0, 1.0], [9, 0.9], [18, 0.8], [27, 0.7]]
    landingHeadwind: [[0, 1.0], [9, 0.9], [18, 0.8], [27, 0.7]]
    tailwindPctPer2Kt: 10
  # POH distances by pressure altitude and outside air temperature, as
  # printed (ft converted to metres, 0.1 m): cells [ground roll, total over
  # 50 ft]. Take-off: Figure 5-5, 2550 lb (sheet 1) and 2200 lb (sheet 3);
  # the 2400 lb sheet 2 lies between them on the safe side (pinned). Landing:
  # Figure 5-11, 2550 lb only, so both columns carry it.
