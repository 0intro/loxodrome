    - { altFt: 0, temperatureC: 40, massMax: [288.0, 548.6], massMin: [146.3, 275.8] }
    - { altFt: 1000, temperatureC: 0, massMax: [236.2, 454.2], massMin: [120.4, 233.2] }
    - { altFt: 1000, temperatureC: 10, massMax: [254.5, 487.7], massMin: [129.5, 248.4] }
    - { altFt: 1000, temperatureC: 20, massMax: [274.3, 524.3], massMin: [138.7, 265.2] }
