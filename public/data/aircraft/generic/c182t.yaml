# Aircraft data sheet (Loxodrome). Units in the field names: kg, m, L, kt,
# ft, deg C; distances in metres. Verify against the aircraft flight manual.
#
# GENERIC sheet: the Cessna 182T from its Pilot's Operating Handbook alone,
# no airframe's weighing: 182TPHBUS-03 (NAV III avionics, GFC 700 AFCS,
# original issue 27 October 2006, revision 3 of 22 November 2010), serials
# 18281869, 18281876 and on. Converted from the POH's lb, in, US gal and ft:
# 1 lb = 0.45359237 kg, 1 in = 0.0254 m, 1 US gal = 3.785411784 L,
# 1 ft = 0.3048 m.
version: 1

aircraft:
  type: C182T
  icaoType: C182
  name: Cessna 182T Skylane NAV III GFC 700, s/n 18281869 and on
  generic: c182t

fuel:
  # POH 1-6: 92.0 US gal total, 87.0 usable (43.5 a
  # tank). Approved grades 100LL (blue) and 100 (green); 100 is not one of
  # the app's grades.
  capacityL: 348.3
  usableL: 329.3
  types: [100LL]
  consumptionLph: 49.2

cruise:
  speedKt: 136
  name: '75 % (2400 rpm)'
  # The POH's cruise tables (Figure 5-9, 3100 lb, recommended lean mixture,
  # cowl flaps closed, standard temperature), read at 3000 ft: each power
  # found between the manifold-pressure rows of one rpm at 2000 ft (sheets
  # 3-4, p. 5-24/5-25) and 4000 ft (sheets 5-6, p. 5-26/5-27), then the mean of the two
  # altitudes; speeds rounded down, flows to 0.1 L/h. Maximum cruise power
  # is 80 % (its note). 75 %: 136.40 kt, 12.992 US gal/h; the 2200
  # and 2300 rpm rows give the same within 0.4 kt and 0.03 US gal/h. 55 % is
  # reached at both altitudes from 2100 rpm only.
  settings:
    - { name: '65 % (2400 rpm)', speedKt: 127, consumptionLph: 43.3 }
    - { name: '55 % (2100 rpm)', speedKt: 118, consumptionLph: 38.2 }

climb: # Figure 5-7, p. 5-19: 3100 lb, flaps up, 2400 rpm full throttle, 80 KIAS; 980 ft/min at 0 °C and 905 at 20 °C at sea level, 923.75 at ISA (computed)
  speedKt: 80
  rateFtMin: 924

massAndBalance:
  # Empty mass and arm: the POH's sample loading problem (Figure 6-3,
  # p. 6-11), 1924 lb at a moment of 70.9 lb-in/1000, so 36.850 in; the mass
  # rounded down to 0.1 kg, so that example at 3100 lb stays inside the
  # envelope.
  emptyMassKg: 872.7
  emptyArmM: 0.936
  stations:
    # Loading arrangements, Figure 6-5 p. 6-14: seats at 37 in (32 to 50),
    # rear seats 74, baggage area A 97 (82 to 109), B 116 (109 to 124), C 129
    # (124 to 134). Baggage limits 2-8: A 120 lb, B 80 lb, C 80 lb; A, B and C
    # together 200 lb, B and C together 80 lb (combined limits the app
    # cannot state as stations).
    - { label: Front seats, armM: 0.9398, defaultMassKg: 80 }
    - { label: Rear seats, armM: 1.8796, defaultMassKg: 0 }
    - { label: Baggage A, armM: 2.4638, defaultMassKg: 0, maxMassKg: 54.4 }
    - { label: Baggage B, armM: 2.9464, defaultMassKg: 0, maxMassKg: 36.2 }
    - { label: Baggage C, armM: 3.2766, defaultMassKg: 0, maxMassKg: 36.2 }
  fuelArmM: 1.1811 # usable fuel at FS 46.50 (Figure 6-5 note)
  # 2-8: forward 33.0 in at 2250 lb or less, straight to 35.5 in at 2700 lb,
  # then straight to 40.9 in at 3100 lb; aft 46.0 in at all weights (the
  # CG-limits chart, Figure 6-8 p. 6-17, starts at 1800 lb). Autopilot
  # operation is prohibited forward of 34.2 in (a note, not a mass limit).
  envelope:
    - { armM: 0.8382, massKg: 816.47 }
    - { armM: 0.8382, massKg: 1020.58 }
    - { armM: 0.9017, massKg: 1224.7 }
    - { armM: 1.0389, massKg: 1406.13 }
    - { armM: 1.1684, massKg: 1406.13 }
    - { armM: 1.1684, massKg: 816.47 }
  # 2-8: maximum landing weight 2950 lb (take-off 3100, ramp 3110).
  maxLandingMassKg: 1338.09

performance:
  kind: table
  marginFactor: 1.3
  # Dry grass: +15 % of the ground roll at take-off, +45 % at landing (the
  # tables' notes); one factor on both distances must cover the landing
  # distance over 15 m, at most x1.216: 1.22. Wet: none in
  # the POH, the app's default. Flaps up landing: "allow for 40 % longer
  # distances" (Figure 5-12 note).
  grassFactor: 1.22
  wetFactor: 1.15
  flaplessLandingFactor: 1.4
  massMaxKg: 1406.13 # 3100 lb
  massMinKg: 1043.3 # 2300 lb
  # Short field technique, take-off flaps 20° (Figure 5-6 conditions);
  # landing flaps FULL (no angle printed).
  takeoffFlapsDeg: 20
  takeoffProcedure: short-field
  wind:
    # Both tables: -10 % per 9 kt of headwind, +10 % per 2 kt of tailwind
    # up to 10 kt.
    takeoffHeadwind: [[0, 1.0], [9, 0.9], [18, 0.8], [27, 0.7]]
    landingHeadwind: [[0, 1.0], [9, 0.9], [18, 0.8], [27, 0.7]]
    tailwindPctPer2Kt: 10
  # POH distances by pressure altitude and outside air temperature, as
  # printed (ft to metres, 0.1 m): cells [ground roll, total over 50 ft].
  # Take-off, Figure 5-6: 3100 lb (sheet 1, p. 5-16) and 2300 lb (sheet 3);
  # the 2700 lb sheet lies between them on the safe side (pinned). At
  # 3100 lb the POH deletes the hot cells at 7000 and 8000 ft (climb after
  # lift-off under 150 ft/min), so the grid stops at 6000 ft, above which
  # the app gives no take-off figure. Landing, Figure 5-12 (p. 5-37): 2950 lb,
  # the maximum landing weight, so both columns carry it. One cell is not as
  # printed: 1000 ft, 0 C prints a total of 1265 ft, shorter than the 1300
  # ft at sea level (every copy prints it, revision 4 of 2005 too), which no
  # landing can be. The 1000 ft row reads the sea-level row one column on
  # (600/1365, 620/1400; this cell's 580 ft roll too), so its total is that
  # row's 10 C one, 1335 ft (406.9 m).
  takeoff:
    - { altFt: 0, temperatureC: 0, massMax: [217.9, 416.1], massMin: [111.3, 214.9] }
    - { altFt: 0, temperatureC: 10, massMax: [233.2, 445.0], massMin: [118.9, 228.6] }
