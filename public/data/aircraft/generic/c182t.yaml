    - { altFt: 1000, temperatureC: 40, massMax: [313.9, 603.5], massMin: [158.5, 300.2] }
    - { altFt: 2000, temperatureC: 0, massMax: [259.1, 498.3], massMin: [131.1, 253.0] }
    - { altFt: 2000, temperatureC: 10, massMax: [278.9, 536.4], massMin: [140.2, 269.7] }
    - { altFt: 2000, temperatureC: 20, massMax: [298.7, 576.1], massMin: [150.9, 286.5] }
    - { altFt: 2000, temperatureC: 30, massMax: [321.6, 620.3], massMin: [161.5, 306.3] }
    - { altFt: 2000, temperatureC: 40, massMax: [344.4, 667.5], massMin: [172.2, 326.1] }
    - { altFt: 3000, temperatureC: 0, massMax: [281.9, 548.6], massMin: [143.3, 274.3] }
    - { altFt: 3000, temperatureC: 10, massMax: [303.3, 591.3], massMin: [153.9, 292.6] }
    - { altFt: 3000, temperatureC: 20, massMax: [326.1, 637.0], massMin: [164.6, 312.4] }
