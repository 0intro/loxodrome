    - { altFt: 0, isaOffsetC: 0, massMax: [239, 524], massMin: [205, 460] }
    - { altFt: 0, isaOffsetC: 20, massMax: [256, 552], massMin: [215, 485] }
    - { altFt: 4000, isaOffsetC: -20, massMax: [248, 542], massMin: [210, 475] }
    - { altFt: 4000, isaOffsetC: 0, massMax: [268, 576], massMin: [230, 505] }
    - { altFt: 4000, isaOffsetC: 20, massMax: [286, 610], massMin: [245, 535] }
    - { altFt: 8000, isaOffsetC: -20, massMax: [281, 595], massMin: [240, 520] }
    - { altFt: 8000, isaOffsetC: 0, massMax: [305, 634], massMin: [260, 555] }
    - { altFt: 8000, isaOffsetC: 20, massMax: [324, 671], massMin: [275, 585] }

