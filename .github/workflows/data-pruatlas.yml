name: Refresh pruatlas FIR overlay

# Regenerates public/data/pruatlas-firs.json from EUROCONTROL pruatlas
# (https://github.com/euctrl-pru/pruatlas). pruatlas publishes a fresh
# ir-NNN.geojson roughly per AIRAC cycle; we discover the highest NNN at
# fetch time. A weekly Thursday fire catches every cycle, and the content-
# hash skip means non-update weeks no-op without a commit.

on:
  schedule:
    # AIRAC cycles repeat every 28 days, always on a Thursday. Firing
    # every Thursday at 04:00 UTC catches each cycle without our needing
    # to track the AIRAC calendar.
    - cron: '0 4 * * 4'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Build pruatlas-firs.json
        run: go run ./cmd/pruatlas

      - name: Commit if changed
        run: |
          set -euo pipefail
          if git diff --quiet -- public/data/pruatlas-firs.json; then
            echo "No data changes."
          else
            # Stamp pruatlas's internal ir-NNN cycle into the commit
            # message so a bisect can read history at a glance. jq absent
            # => empty suffix is the safe fallback.
            cycle=$(jq -r '.source.cycle // empty' public/data/pruatlas-firs.meta.json)
            msg="update pruatlas FIRs"
            [ -n "$cycle" ] && msg="$msg, ir-$cycle"
            git config user.name 'github-actions[bot]'
            git config user.email 'github-actions[bot]@users.noreply.github.com'
            git add public/data/pruatlas-firs.json public/data/pruatlas-firs.meta.json
            git commit -m "$msg"
            # Another data workflow (or a manual push) may have landed on
            # main between checkout and here; replay on top and retry.
            n=0
            until git push; do
              n=$((n+1))
              if [ "$n" -ge 3 ]; then
                echo "push failed after $n attempts"
                exit 1
              fi
              git pull --rebase
            done
          fi
