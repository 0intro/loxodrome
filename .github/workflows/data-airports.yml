name: Refresh airports dataset

on:
  schedule:
    - cron: '0 3 1 * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Build airports.json
        run: go run ./cmd/airports

      # No AIRAC suffix on the commit message: this run is OurAirports-
      # only (no -aixm flag), and OurAirports isn't AIRAC-keyed. The
      # data-world workflow does stamp AIRAC because pruatlas is.
      - name: Commit if changed
        run: |
          set -euo pipefail
          if git diff --quiet -- public/data/airports.json; then
            echo "No data changes."
          else
            git config user.name 'github-actions[bot]'
            git config user.email 'github-actions[bot]@users.noreply.github.com'
            git add public/data/airports.json public/data/airports.meta.json
            git commit -m "update airports data"
            # Another data workflow (or a manual push) may have landed on
            # main between checkout and here; replay on top and retry.
            n=0
            until git push; do
              n=$((n+1))
              if [ "$n" -ge 3 ]; then
                echo "push failed after $n attempts"
                exit 1
              fi
              git pull --rebase
            done
          fi
