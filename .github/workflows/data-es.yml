name: Refresh ENAIRE Spain datasets

# Regenerates public/data/es-{airspaces,navaids}.json from the
# ENAIRE Spain AIXM 5.1 publication, plus es-supaip.json from the
# separate public supplement listing
# (https://aip.enaire.es/AIP/Suplementos-es.html).
# (https://aip.enaire.es/AIP/DatosDigitales-en.html). ENAIRE labels
# slices by amendment number (LE_Amdt_A_<YEAR>_<NN>_*); we scrape
# the index for the most recent _Airspace.xml and _EnRoute.xml.
#
# Per-aerodrome obstacle files (LE_Amdt_*_Obstacles_<ICAO>.xml) are
# not pulled here; their amendment numbers vary across aerodromes
# and a 51-aerodrome multi-fetch would belong in a dedicated
# workflow.

on:
  schedule:
    # Same Thursday window, one hour past UK.
    - cron: '0 5 * * 4'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      # Five of the ~230 supplements in force are published as a PDF
      # with no HTML edition beside them, and one of those is a standing
      # transit corridor with real geometry. cmd/es reads them through
      # pdftotext; without it those rows would silently lose their
      # zones (the build degrades, it does not fail).
      - name: Install poppler-utils
        run: sudo apt-get update && sudo apt-get install -y poppler-utils

      # Discover the most recent amendment cycle for the Airspace and
      # EnRoute slices independently (ENAIRE doesn't lock them to the
      # same amendment number). Per-aerodrome obstacle filenames
      # encode their own amendment per aerodrome; we capture the
      # full list verbatim.
      - name: Resolve current amendments
        id: amdt
        run: |
          set -euo pipefail
          INDEX='https://aip.enaire.es/AIP/DatosDigitales-en.html'
          PAGE=$(curl -fsSL "$INDEX")
          AS=$(echo "$PAGE" | grep -oE 'LE_Amdt_A_[0-9]{4}_[0-9]{2}_AIP_DS_FULL_Airspace\.xml' \
            | sort -ru | head -n1)
          EN=$(echo "$PAGE" | grep -oE 'LE_Amdt_A_[0-9]{4}_[0-9]{2}_AIP_DS_FULL_EnRoute\.xml' \
            | sort -ru | head -n1)
          if [ -z "$AS" ] || [ -z "$EN" ]; then
            echo "Could not find Airspace + EnRoute filenames on the index"
            exit 1
          fi
          echo "airspace=$AS" >> "$GITHUB_OUTPUT"
          echo "enroute=$EN" >> "$GITHUB_OUTPUT"
          # Per-aerodrome obstacle filenames; one per airport, each
          # with its own amendment number. Also includes the
          # en-route (Obstacles_ENR) bundle and the twin-aerodrome
          # files (Obstacles_<ICAO>_<ICAO>.xml).
          echo "$PAGE" \
            | grep -oE 'LE_Amdt_[A-Z]_[0-9]{4}_[0-9]{2}_AIP_DS_FULL_Obstacles_([A-Z]{3,4}(_[A-Z]{4})?|ENR)\.xml' \
            | sort -u > /tmp/es-obs-files.txt
          OBS_COUNT=$(wc -l < /tmp/es-obs-files.txt)
          echo "Found $OBS_COUNT obstacle files"
          # Aerodrome-bearing filenames. ENAIRE publishes one file
          # per single aerodrome (LE_Amdt_*_<ICAO>.xml), occasional
          # twin-aerodrome files (LE_Amdt_*_<ICAO>_<ICAO>.xml), and
          # bundled lists of restricted / temporary airfields
          # (ADHP_Restricted / ADHP_Temp). Exclude Obstacles_* and
          # _Metadata.xml siblings.
          echo "$PAGE" \
            | grep -oE 'LE_Amdt_[A-Z]_[0-9]{4}_[0-9]{2}_AIP_DS_FULL_([A-Z]{4}(_[A-Z]{4})?|ADHP_(Restricted|Temp))\.xml' \
            | grep -v '_Metadata' \
            | grep -v '_Obstacles_' \
            | sort -u > /tmp/es-ad-files.txt
          AD_COUNT=$(wc -l < /tmp/es-ad-files.txt)
          echo "Found $AD_COUNT aerodrome files"
          # Pull the amendment label out of the airspace filename for
          # the commit-message suffix; the airspace cycle is the one
          # most operators track.
          LABEL=$(echo "$AS" | sed -E 's/LE_Amdt_A_([0-9]{4})_([0-9]{2})_AIP_DS_FULL_Airspace\.xml/\1-\2/')
          echo "label=$LABEL" >> "$GITHUB_OUTPUT"
          echo "Resolved: $AS, $EN (label=$LABEL)"

      - name: Download ENAIRE datasets
        env:
          AS: ${{ steps.amdt.outputs.airspace }}
          EN: ${{ steps.amdt.outputs.enroute }}
        run: |
          set -euo pipefail
          mkdir -p local local/es-obstacles local/es-aerodromes
          BASE='https://aip.enaire.es/AIP/contenido_Datasets'
          curl -fsSL -o "local/$AS" "${BASE}/${AS}"
          curl -fsSL -o "local/$EN" "${BASE}/${EN}"
          # Every file listed on the index must download: a partial set
          # would still clear the coarse -min floors and commit a dataset
          # with whole aerodromes missing. Collect the failures so the log
          # names every missing file, then fail the job.
          fail=0
          while read -r fname; do
            curl -fsSL -o "local/es-obstacles/$fname" "${BASE}/${fname}" || {
              echo "error: could not fetch $fname"
              fail=1
            }
          done < /tmp/es-obs-files.txt
          while read -r fname; do
            curl -fsSL -o "local/es-aerodromes/$fname" "${BASE}/${fname}" || {
              echo "error: could not fetch $fname"
              fail=1
            }
          done < /tmp/es-ad-files.txt
          if [ "$fail" -ne 0 ]; then
            echo "One or more listed files failed to download; refusing to build a partial dataset."
            exit 1
          fi

      - name: Build es-airspaces
        env:
          AS: ${{ steps.amdt.outputs.airspace }}
        run: go run ./cmd/es -in "local/${AS}" -only=airspaces

      # EnRoute has navaids + airports (none in practice; airports are
      # in separate slices). -only excludes airspaces because the
      # EnRoute file has zero of them, which would trip the sanity
      # window.
      - name: Build es-navaids
        env:
          EN: ${{ steps.amdt.outputs.enroute }}
        run: go run ./cmd/es -in "local/${EN}" -only=navaids -min-navaids=500

      # Aggregate every per-aerodrome AIP XML into one es-airports.json
      # (AirportHeliport + Runway features). Each aerodrome's AIP file
      # ships with its own AIRAC amendment number.
      - name: Build es-airports
        run: go run ./cmd/es -only=airports -min-airports=20 -max-airports=500 local/es-aerodromes/*.xml

      # The AIP directory half of the same per-aerodrome files: the
      # operator contacts ENAIRE annotates each aerodrome and helipad
      # with. Its notes carry no propertyName, so the shared builder
      # keeps contacts only (internal/aixm5build/facilities.go).
      - name: Build es-aerodrome-facilities
        run: go run ./cmd/es -only=facilities local/es-aerodromes/*.xml

      # Aggregate every per-aerodrome obstacle XML into one
      # es-obstacles.json. The cap is wide because the per-aerodrome
      # files include Area 2-4 obstacles (close-to-runway, much more
      # detailed than UK's Area-1-only dataset).
      - name: Build es-obstacles
        run: go run ./cmd/es -only=obstacles -min-obstacles=1000 -max-obstacles=500000 local/es-obstacles/*.xml

      # The supplements come from the public listing, not the AIXM
      # export, so this step needs none of the downloads above. Rebuilt
      # whole every run: ENAIRE delists a supplement when it is
      # cancelled, which is exactly the signal that it should stop
      # being drawn (cmd/es/supaip.go). Its own publish gates (missing
      # documents, a geometry collapse) fail the step; continue-on-error
      # keeps a supplement-side refusal from holding back the AIXM
      # datasets built above (the step stays red in the run).
      - name: Build es-supaip
        continue-on-error: true
        run: go run ./cmd/es -only=supaip

      - name: Commit if changed
        env:
          LABEL: ${{ steps.amdt.outputs.label }}
        run: |
          set -euo pipefail
          # Gate on the data files only: the .meta.json sidecars carry a
          # generatedAt stamped on every run, so including them would
          # defeat the non-update-week no-op skip.
          if git diff --quiet -- 'public/data/es-*.json' ':(exclude)public/data/es-*.meta.json'; then
            echo "No data changes."
          else
            git config user.name 'github-actions[bot]'
            git config user.email 'github-actions[bot]@users.noreply.github.com'
            git add public/data/es-*.json public/data/es-*.meta.json
            git commit -m "update ENAIRE Spain datasets, AIRAC ${LABEL}"
            # Another data workflow (or a manual push) may have landed on
            # main between checkout and here; replay on top and retry.
            n=0
            until git push; do
              n=$((n+1))
              if [ "$n" -ge 3 ]; then
                echo "push failed after $n attempts"
                exit 1
              fi
              git pull --rebase
            done
          fi
