name: Refresh French SUP AIP overlay

# Regenerates public/data/fr-supaip.json from the public SIA SUP AIP listing
# pages and supplement PDFs (no API key; throttled scrape). The listing isn't
# AIRAC-keyed; it advertises the current + upcoming supplements, so a weekly
# Thursday fire catches each cycle's churn, and the content-hash skip means
# non-update weeks no-op without a commit. The PDF cache (restored below) keeps
# each run incremental: only newly-listed supplements are downloaded.

on:
  schedule:
    # Same Thursday slot as the FAA / pruatlas refreshes; runs are independent
    # (different paths to diff) so they don't race.
    - cron: '0 4 * * 4'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Install poppler-utils (pdftotext fallback)
        # cmd/supaip parses PDFs with the pure-Go rsc.io/pdf, and falls back to
        # poppler's pdftotext for the files it cannot read (Acrobat Distiller).
        run: sudo apt-get update && sudo apt-get install -y poppler-utils

      - name: Restore SUP AIP PDF cache
        uses: actions/cache@v6
        with:
          # Content-addressed PDF cache (gitignored, under local/). A unique
          # key each run plus the prefix restore-key means the latest cache is
          # restored and a fresh, larger one is saved; downloads stay minimal.
          path: local/supaip-cache
          key: supaip-cache-${{ github.run_id }}
          restore-keys: |
            supaip-cache-

      - name: Build fr-supaip.json
        run: go run ./cmd/supaip

      - name: Commit if changed
        run: |
          set -euo pipefail
          if git diff --quiet -- public/data/fr-supaip.json; then
            echo "No data changes."
          else
            git config user.name 'github-actions[bot]'
            git config user.email 'github-actions[bot]@users.noreply.github.com'
            git add public/data/fr-supaip.json public/data/fr-supaip.meta.json
            git commit -m "update French SUP AIP"
            # Another data workflow (or a manual push) may have landed on
            # main between checkout and here; replay on top and retry.
            n=0
            until git push; do
              n=$((n+1))
              if [ "$n" -ge 3 ]; then
                echo "push failed after $n attempts"
                exit 1
              fi
              git pull --rebase
            done
          fi
